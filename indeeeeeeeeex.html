<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Smash Hit</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070f;
    font-family:"Trebuchet MS",Arial,sans-serif;user-select:none;}
  #c{display:block;width:100%;height:100%;touch-action:none;}
  .hud{position:fixed;top:0;left:0;right:0;padding:14px 16px;display:flex;
    justify-content:space-between;align-items:flex-start;pointer-events:none;
    color:#dff3ff;text-shadow:0 2px 8px #000;font-size:15px;letter-spacing:1px;}
  .balls{font-size:26px;font-weight:bold;color:#9fe4ff;}
  .lbl{font-size:11px;opacity:.6;letter-spacing:2px;}
  .right{text-align:right;}
  .dist{font-size:22px;font-weight:bold;}
  #flash{position:fixed;inset:0;background:#ff3355;opacity:0;pointer-events:none;}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;
    justify-content:center;align-items:center;gap:14px;text-align:center;
    background:radial-gradient(circle at 50% 40%,rgba(20,40,70,.85),rgba(3,5,12,.96));
    color:#e8f8ff;padding:24px;}
  h1{font-size:42px;letter-spacing:6px;color:#a8e8ff;text-shadow:0 0 24px #2ab8ff;}
  h2{font-size:30px;letter-spacing:4px;color:#ff8fa3;}
  .tip{font-size:14px;opacity:.75;line-height:1.6;max-width:280px;}
  .tap{margin-top:8px;font-size:16px;color:#7fe0ff;animation:p 1.2s infinite;}
  .score{font-size:20px;}
  @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
  .hidden{display:none!important;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div>
    <div class="lbl">BALLS</div>
    <div class="balls" id="ballsUI">25</div>
  </div>
  <div class="right">
    <div class="lbl">DISTANCE</div>
    <div class="dist" id="distUI">0 m</div>
    <div class="lbl" id="bestUI">BEST 0</div>
  </div>
</div>

<div id="flash"></div>

<div id="overlay">
  <h1>SMASH HIT</h1>
  <div class="tip"><b>Tap</b> anywhere to throw a ball.<br>
  Smash the <b>glass</b> before you hit it.<br>
  Grab <b>crystals</b> for extra balls.</div>
  <div class="tap">TAP TO PLAY</div>
</div>

<script>
(function(){
"use strict";
const cvs=document.getElementById("c"),ctx=cvs.getContext("2d");
const ballsUI=document.getElementById("ballsUI"),distUI=document.getElementById("distUI"),
      bestUI=document.getElementById("bestUI"),overlay=document.getElementById("overlay"),
      flash=document.getElementById("flash");
let W=0,H=0,DPR=1,F=0;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cvs.width=W*DPR;cvs.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  F=Math.max(420,Math.min(W,H)*1.15);
}
window.addEventListener("resize",resize);resize();

/* ---------- world constants ---------- */
const HW=4.6, FLOOR=-3.2, CEIL=3.2, SEG=6, VIEW=170;
const BG=[6,9,20];
function mix(c,dz,a){
  const t=Math.max(0,Math.min(1,(dz-8)/135));
  return "rgba("+((c[0]+(BG[0]-c[0])*t)|0)+","+((c[1]+(BG[1]-c[1])*t)|0)+","+
         ((c[2]+(BG[2]-c[2])*t)|0)+","+(a===undefined?1:a)+")";
}

/* ---------- state ---------- */
let cam,balls,panes,shards,crystals,ammo,dist,speed,nextZ,shake,over,started,best;
best=parseInt(localStorage.getItem("smashBest")||"0",10);
bestUI.textContent="BEST "+best;

function reset(){
  cam={x:0,y:0,z:0,pz:0};
  balls=[];panes=[];shards=[];crystals=[];
  ammo=25;dist=0;speed=13;nextZ=45;shake=0;over=false;
  updateHUD();
}
function updateHUD(){
  ballsUI.textContent=ammo;
  distUI.textContent=(dist|0)+" m";
}

/* ---------- audio ---------- */
let AC=null;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function noise(dur,f0,f1,vol){
  const a=ac();if(!a)return;
  const n=a.sampleRate*dur|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);}
  const s=a.createBufferSource();s.buffer=b;
  const flt=a.createBiquadFilter();flt.type="bandpass";
  flt.frequency.setValueAtTime(f0,a.currentTime);
  flt.frequency.exponentialRampToValueAtTime(f1,a.currentTime+dur);
  flt.Q.value=1.2;
  const g=a.createGain();g.gain.value=vol;
  g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
  s.connect(flt);flt.connect(g);g.connect(a.destination);s.start();
}
const sSmash=()=>noise(.35,4200,900,.35);
const sThrow=()=>noise(.09,900,240,.14);
const sCry  =()=>{const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();
  o.type="triangle";o.frequency.setValueAtTime(880,a.currentTime);
  o.frequency.exponentialRampToValueAtTime(1760,a.currentTime+.18);
  g.gain.value=.18;g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.25);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.26);};
const sCrash=()=>noise(.5,300,60,.4);

/* ---------- projection ---------- */
let sx=0,sy=0;
function proj(x,y,z){
  const dz=z-cam.z;
  if(dz<0.35)return null;
  const s=F/dz;
  return {x:W/2+(x-cam.x)*s+sx, y:H/2-(y-cam.y)*s+sy, s:s, dz:dz};
}
function quad(a,b,c,d,fill,stroke,lw){
  const p=[proj(a[0],a[1],a[2]),proj(b[0],b[1],b[2]),proj(c[0],c[1],c[2]),proj(d[0],d[1],d[2])];
  if(!p[0]||!p[1]||!p[2]||!p[3])return;
  ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);
  for(let i=1;i<4;i++)ctx.lineTo(p[i].x,p[i].y);
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}
}

/* ---------- obstacle spawning ---------- */
function makePane(z,x0,x1,y0,y1){
  const cols=Math.max(2,Math.round((x1-x0)/1.15)),
        rows=Math.max(2,Math.round((y1-y0)/1.05));
  const cells=[];
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++)cells.push(1);
  panes.push({z:z,x0:x0,x1:x1,y0:y0,y1:y1,cols:cols,rows:rows,cells:cells,alive:cols*rows});
}
function cellRect(p,i,j){
  const w=(p.x1-p.x0)/p.cols,h=(p.y1-p.y0)/p.rows;
  return [p.x0+i*w,p.y0+j*h,w,h];
}
function spawn(z){
  const r=Math.random();
  if(r<0.30){                            // full wall
    makePane(z,-HW,HW,FLOOR,CEIL);
  }else if(r<0.50){                      // vertical column
    const w=2.2+Math.random()*2, a=-HW+Math.random()*(2*HW-w);
    makePane(z,a,a+w,FLOOR,CEIL);
    if(Math.random()<0.5)crystals.push({x:a>0?a-1.4:a+w+1.4,y:-1+Math.random()*2,z:z+2,r:0});
  }else if(r<0.68){                      // horizontal band
    const h=1.8+Math.random()*1.6, a=FLOOR+Math.random()*((CEIL-FLOOR)-h);
    makePane(z,-HW,HW,a,a+h);
  }else if(r<0.84){                       // double door with gap
    const g=1.4+Math.random()*1.6, c=-1.5+Math.random()*3;
    makePane(z,-HW,c-g/2,FLOOR,CEIL);
    makePane(z,c+g/2,HW,FLOOR,CEIL);
    crystals.push({x:c,y:0,z:z,r:0});
  }else{                                  // crystal cluster
    const n=1+(Math.random()*3|0);
    for(let i=0;i<n;i++)
      crystals.push({x:-3+Math.random()*6,y:-2+Math.random()*4,z:z+i*3,r:0});
  }
}

/* ---------- shattering ---------- */
function shatterCell(p,i,j,vx,vy,vz){
  const R=cellRect(p,i,j);
  shards.push({x:R[0]+R[2]/2,y:R[1]+R[3]/2,z:p.z,w:R[2],h:R[3],
    vx:vx,vy:vy,vz:vz,rot:Math.random()*6.28,vr:(Math.random()-.5)*7,life:2.4});
}
function breakAt(p,hx,hy,rad,push){
  let broke=0;
  for(let j=0;j<p.rows;j++)for(let i=0;i<p.cols;i++){
    const k=j*p.cols+i;
    if(!p.cells[k])continue;
    const R=cellRect(p,i,j),cx=R[0]+R[2]/2,cy=R[1]+R[3]/2;
    const d=Math.hypot(cx-hx,cy-hy);
    if(d<rad+Math.random()*0.6){
      p.cells[k]=0;p.alive--;broke++;
      const inv=1/(d+0.4);
      shatterCell(p,i,j,(cx-hx)*inv*7,(cy-hy)*inv*7+2,push*(0.5+Math.random()));
    }
  }
  if(broke){sSmash();shake=Math.min(14,shake+4);}
  return broke;
}
function shatterAll(p,push){
  for(let j=0;j<p.rows;j++)for(let i=0;i<p.cols;i++){
    const k=j*p.cols+i;
    if(!p.cells[k])continue;
    p.cells[k]=0;p.alive--;
    const R=cellRect(p,i,j);
    shatterCell(p,i,j,(R[0]-cam.x)*2.2,(R[1]-cam.y)*2.2+3,push*(0.4+Math.random()));
  }
  sSmash();
}

/* ---------- shooting ---------- */
function shoot(mx,my){
  if(over||!started)return;
  if(ammo<=0){ gameOver(); return; }
  ammo--;updateHUD();sThrow();
  let dx=(mx-W/2)/F, dy=-(my-H/2)/F, dz=1;
  const L=Math.hypot(dx,dy,dz), sp=78;
  balls.push({x:cam.x,y:cam.y-0.25,z:cam.z+1.2,
    vx:dx/L*sp, vy:dy/L*sp, vz:dz/L*sp+speed*0.55, life:4});
}

/* ---------- damage / over ---------- */
function hurt(){
  sCrash();shake=22;
  flash.style.opacity=.75;
  setTimeout(()=>flash.style.opacity=0,90);
  ammo-=10;
  if(ammo<0)ammo=0;
  updateHUD();
  if(ammo<=0)gameOver();
}
function gameOver(){
  if(over)return;
  over=true;
  if((dist|0)>best){best=dist|0;localStorage.setItem("smashBest",best);}
  bestUI.textContent="BEST "+best;
  overlay.innerHTML='<h2>GAME OVER</h2>'+
    '<div class="score">DISTANCE <b>'+(dist|0)+' m</b></div>'+
    '<div class="score">BEST <b>'+best+' m</b></div>'+
    '<div class="tap">TAP TO RETRY</div>';
  overlay.classList.remove("hidden");
}

/* ---------- update ---------- */
function update(dt){
  if(!started||over)return;
  cam.pz=cam.z;
  speed=Math.min(34,speed+dt*0.42);
  cam.z+=speed*dt;
  dist=cam.z;
  cam.x=Math.sin(cam.z*0.031)*2.3+Math.sin(cam.z*0.011)*0.8;
  cam.y=Math.sin(cam.z*0.047)*0.55;
  updateHUD();

  while(nextZ<cam.z+VIEW){ spawn(nextZ); nextZ+=17+Math.random()*13; }

  /* balls */
  for(let b=balls.length-1;b>=0;b--){
    const o=balls[b],pz=o.z;
    o.vy-=13*dt;
    o.x+=o.vx*dt;o.y+=o.vy*dt;o.z+=o.vz*dt;o.life-=dt;
    if(o.y<FLOOR+0.2){o.y=FLOOR+0.2;o.vy*=-0.45;o.vx*=0.8;}
    if(o.x<-HW+0.2){o.x=-HW+0.2;o.vx*=-0.6;}
    if(o.x>HW-0.2){o.x=HW-0.2;o.vx*=-0.6;}
    /* glass */
    for(let i=0;i<panes.length;i++){
      const p=panes[i];
      if(p.alive>0 && pz<=p.z && o.z>=p.z){
        const t=(p.z-pz)/Math.max(0.0001,o.z-pz);
        const hx=o.x+(o.vx*dt)*(t-1)+o.vx*dt*0, hy=o.y;
        const ix=o.x-o.vx*dt*(1-t), iy=o.y-o.vy*dt*(1-t);
        if(ix>p.x0-0.5&&ix<p.x1+0.5&&iy>p.y0-0.5&&iy<p.y1+0.5)
          breakAt(p,ix,iy,1.45,o.vz*0.28);
      }
    }
    /* crystals */
    for(let i=crystals.length-1;i>=0;i--){
      const c=crystals[i];
      if(pz<=c.z&&o.z>=c.z){
        const t=(c.z-pz)/Math.max(0.0001,o.z-pz);
        const ix=o.x-o.vx*dt*(1-t), iy=o.y-o.vy*dt*(1-t);
        if(Math.abs(ix-c.x)<0.85&&Math.abs(iy-c.y)<0.85){
          crystals.splice(i,1);ammo+=3;sCry();updateHUD();
        }
      }
    }
    if(o.life<=0||o.z<cam.z-6||o.z>cam.z+VIEW)balls.splice(b,1);
  }

  /* shards */
  for(let i=shards.length-1;i>=0;i--){
    const s=shards[i];
    s.vy-=17*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;
    s.rot+=s.vr*dt;s.life-=dt;
    if(s.y<FLOOR+0.05){s.y=FLOOR+0.05;s.vy*=-0.3;s.vx*=0.7;s.vz*=0.7;}
    if(s.life<=0||s.z<cam.z-4)shards.splice(i,1);
  }

  /* player crossing panes */
  for(let i=panes.length-1;i>=0;i--){
    const p=panes[i];
    if(p.z>cam.pz&&p.z<=cam.z){
      if(p.alive>0){
        let hit=false;
        for(let j=0;j<p.rows&&!hit;j++)for(let k=0;k<p.cols;k++){
          if(!p.cells[j*p.cols+k])continue;
          const R=cellRect(p,k,j);
          const cx=Math.max(R[0],Math.min(cam.x,R[0]+R[2])),
                cy=Math.max(R[1],Math.min(cam.y,R[1]+R[3]));
          if(Math.hypot(cx-cam.x,cy-cam.y)<0.55){hit=true;break;}
        }
        if(hit){shatterAll(p,speed*0.5);hurt();}
      }
    }
    if(p.z<cam.z-8)panes.splice(i,1);
  }
  for(let i=crystals.length-1;i>=0;i--){
    const c=crystals[i];c.r+=dt*2.4;
    if(c.z<cam.z-4)crystals.splice(i,1);
  }
  shake*=Math.pow(0.0015,dt);
}

/* ---------- render ---------- */
function drawTunnel(){
  const base=Math.floor(cam.z/SEG)*SEG;
  for(let i=Math.floor(VIEW/SEG);i>=-1;i--){
    const z0=base+i*SEG,z1=z0+SEG,dz=z0-cam.z+SEG;
    if(z1<cam.z)continue;
    const par=((z0/SEG)|0)%2===0;
    const wall=par?[38,58,92]:[30,46,74];
    const flr =par?[26,38,60]:[20,30,48];
    const ceil=par?[18,26,44]:[14,20,36];
    quad([-HW,FLOOR,z0],[-HW,CEIL,z0],[-HW,CEIL,z1],[-HW,FLOOR,z1],mix(wall,dz),mix([70,110,160],dz,.5));
    quad([HW,FLOOR,z0],[HW,CEIL,z0],[HW,CEIL,z1],[HW,FLOOR,z1],mix(wall,dz),mix([70,110,160],dz,.5));
    quad([-HW,FLOOR,z0],[HW,FLOOR,z0],[HW,FLOOR,z1],[-HW,FLOOR,z1],mix(flr,dz),mix([80,140,190],dz,.35));
    quad([-HW,CEIL,z0],[HW,CEIL,z0],[HW,CEIL,z1],[-HW,CEIL,z1],mix(ceil,dz),mix([60,90,140],dz,.25));
    /* glow rails */
    quad([-HW+.08,FLOOR+.1,z0],[-HW+.08,FLOOR+.28,z0],[-HW+.08,FLOOR+.28,z1],[-HW+.08,FLOOR+.1,z1],mix([80,200,255],dz,.55),null);
    quad([HW-.08,FLOOR+.1,z0],[HW-.08,FLOOR+.28,z0],[HW-.08,FLOOR+.28,z1],[HW-.08,FLOOR+.1,z1],mix([80,200,255],dz,.55),null);
  }
}
function drawPane(p){
  const dz=p.z-cam.z;
  const fill=mix([150,215,255],dz,.26), edge=mix([215,245,255],dz,.75);
  for(let j=0;j<p.rows;j++)for(let i=0;i<p.cols;i++){
    if(!p.cells[j*p.cols+i])continue;
    const R=cellRect(p,i,j);
    quad([R[0],R[1],p.z],[R[0]+R[2],R[1],p.z],[R[0]+R[2],R[1]+R[3],p.z],[R[0],R[1]+R[3],p.z],fill,edge,1);
  }
  /* frame */
  if(p.alive>0)
    quad([p.x0,p.y0,p.z],[p.x1,p.y0,p.z],[p.x1,p.y1,p.z],[p.x0,p.y1,p.z],null,mix([180,240,255],dz,.9),2);
}
function drawShard(s){
  const pr=proj(s.x,s.y,s.z);if(!pr)return;
  const w=s.w*pr.s,h=s.h*pr.s,a=Math.max(0,Math.min(1,s.life/1.2));
  ctx.save();ctx.translate(pr.x,pr.y);ctx.rotate(s.rot);
  ctx.fillStyle=mix([200,240,255],pr.dz,.4*a);
  ctx.strokeStyle=mix([240,255,255],pr.dz,.8*a);ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(-w/2,-h/2);ctx.lineTo(w/2,-h/3);ctx.lineTo(w/3,h/2);ctx.lineTo(-w/2,h/3);
  ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
}
function drawBall(o){
  const pr=proj(o.x,o.y,o.z);if(!pr)return;
  const r=Math.max(1.5,0.34*pr.s);
  const g=ctx.createRadialGradient(pr.x-r*.35,pr.y-r*.4,r*.1,pr.x,pr.y,r);
  g.addColorStop(0,"#ffffff");g.addColorStop(.45,"#b9d6e8");g.addColorStop(1,"#41586c");
  ctx.beginPath();ctx.arc(pr.x,pr.y,r,0,6.2832);ctx.fillStyle=g;ctx.fill();
}
function drawCrystal(c){
  const pr=proj(c.x,c.y,c.z);if(!pr)return;
  const r=0.62*pr.s, k=Math.abs(Math.cos(c.r))*0.75+0.25;
  ctx.save();ctx.translate(pr.x,pr.y);
  ctx.shadowColor="rgba(90,230,255,.9)";ctx.shadowBlur=Math.min(28,r*.9);
  ctx.beginPath();
  ctx.moveTo(0,-r);ctx.lineTo(r*k,0);ctx.lineTo(0,r);ctx.lineTo(-r*k,0);ctx.closePath();
  ctx.fillStyle=mix([120,240,255],pr.dz,.85);ctx.fill();
  ctx.shadowBlur=0;ctx.strokeStyle="rgba(240,255,255,.95)";ctx.lineWidth=1.4;ctx.stroke();
  ctx.restore();
}
function render(){
  sx=(Math.random()-.5)*shake; sy=(Math.random()-.5)*shake;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#070c18");g.addColorStop(1,"#02040a");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  drawTunnel();
  const items=[];
  for(const p of panes) if(p.alive>0||true) items.push({d:p.z-cam.z,f:drawPane,o:p});
  for(const s of shards) items.push({d:s.z-cam.z,f:drawShard,o:s});
  for(const c of crystals) items.push({d:c.z-cam.z,f:drawCrystal,o:c});
  for(const b of balls) items.push({d:b.z-cam.z,f:drawBall,o:b});
  items.sort((a,b)=>b.d-a.d);
  for(const it of items) it.f(it.o);
  /* speed vignette */
  const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.32,W/2,H/2,Math.max(W,H)*.72);
  v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,.72)");
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  /* crosshair */
  if(started&&!over){
    ctx.strokeStyle="rgba(160,230,255,.35)";ctx.lineWidth=1.2;
    ctx.beginPath();ctx.arc(W/2,H/2,7,0,6.2832);ctx.stroke();
  }
}

/* ---------- loop ---------- */
let last=performance.now();
function loop(t){
  let dt=(t-last)/1000;last=t;
  if(dt>0.05)dt=0.05;
  update(dt);render();
  requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);

/* ---------- input ---------- */
function tap(x,y){
  ac();
  if(!started){ started=true; overlay.classList.add("hidden"); return; }
  if(over){ reset(); started=true; overlay.classList.add("hidden"); return; }
  shoot(x,y);
}
cvs.addEventListener("pointerdown",e=>{e.preventDefault();tap(e.clientX,e.clientY);},{passive:false});
overlay.addEventListener("pointerdown",e=>{e.preventDefault();tap(W/2,H/2);},{passive:false});
window.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();tap(W/2,H/2);}});
})();
</script>
</body>
</html>
